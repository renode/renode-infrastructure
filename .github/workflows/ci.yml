name: Renode CI

on:
  - push
  - pull_request

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: .github/workflows/global.json

      - name: Setup Dotnet artifacts
        run: |
          ln -s .github/workflows/global.json global.json
          ln -s .github/workflows/Directory.Build.targets Directory.Build.targets
          ln -s .github/workflows/.editorconfig .editorconfig
          mkdir -p ../../output

      - name: Register dotnet-format problem matcher
        run: |
          echo "::add-matcher::.github/workflows/problem-matcher.json"

      - name: Run format check
        id: format_check
        continue-on-error: true
        run: |
          dotnet format ./src/Infrastructure.csproj --verify-no-changes --severity warn

      - name: Generate formatting guide
        if: steps.format_check.outcome == 'failure'
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          Your code does not conform to the repository's code style rules.

          Please run `dotnet format ./src/Infrastructure.csproj` to fix discrepancies.
          EOF
          exit 1
